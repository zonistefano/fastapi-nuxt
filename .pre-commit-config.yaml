repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
        args: [--unsafe]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
  # Use the same locked Ruff executable as make check and CI.
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: uv run --project backend --locked ruff check --config backend/pyproject.toml --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run --project backend --locked ruff format --check --config backend/pyproject.toml --force-exclude
        language: system
        types: [python]
