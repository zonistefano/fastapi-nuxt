version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      python-dependencies:
        patterns: ['*']
  - package-ecosystem: bun
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      frontend-dependencies:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
