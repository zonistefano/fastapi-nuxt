docs:
  - changed-files:
      - any-glob-to-any-file: ['**/*.md']
internal:
  - changed-files:
      - any-glob-to-any-file: ['.github/**', '.devcontainer/**', '.vscode/**', 'scripts/**', 'tests/**', 'Makefile', '*compose*.yml', '.pre-commit-config.yaml']
backend:
  - changed-files:
      - any-glob-to-any-file: ['backend/**']
frontend:
  - changed-files:
      - any-glob-to-any-file: ['frontend/**']
