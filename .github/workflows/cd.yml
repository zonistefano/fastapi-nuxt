name: Publish container images
# Opt in by dispatching a reviewed commit from main and providing an image tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Container tag (for example 1.0.0)
        required: true
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-containers
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: astral-sh/setup-uv@v6
        with:
          version-file: .uv-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Check the commit being published
        run: make setup check test
      - name: Validate image coordinates
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo 'Invalid container tag' >&2
            exit 1
          fi
          echo "IMAGE_PREFIX=ghcr.io/${RELEASE_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: make build
      - name: Publish verified images
        run: docker compose -f docker-compose.yml push backend frontend
