services:
  db:
    restart: 'no'
    ports: ['127.0.0.1:5432:5432']

  prestart:
    image: ${IMAGE_PREFIX:-local}/backend-dev:${TAG:-dev}
    build:
      target: development

  backend:
    image: ${IMAGE_PREFIX:-local}/backend-dev:${TAG:-dev}
    build:
      target: development
    restart: 'no'
    ports: ['127.0.0.1:8000:8000']
    command: [fastapi, run, --reload, app/main.py]
    develop:
      watch:
        - path: ./backend/app
          action: sync
          target: /app/app
          ignore: ['**/__pycache__/**']
        - path: ./backend/pyproject.toml
          action: rebuild
        - path: ./backend/uv.lock
          action: rebuild
    volumes:
      - ./backend/alembic/versions:/app/alembic/versions

  frontend:
    image: ${IMAGE_PREFIX:-local}/frontend-dev:${TAG:-dev}
    build:
      dockerfile: Dockerfile.dev
    restart: 'no'
    ports: ['127.0.0.1:3000:3000', '127.0.0.1:24678:24678']
    environment:
      NUXT_PUBLIC_APP_NAME: ${NUXT_PUBLIC_APP_NAME:-FastAPI Nuxt}
      NUXT_PUBLIC_API_URL: ${NUXT_PUBLIC_API_URL:-http://localhost:8000}
      NUXT_PUBLIC_API_WS: ${NUXT_PUBLIC_API_WS:-ws://localhost:8000}
    develop:
      watch:
        - path: ./frontend
          action: sync
          target: /frontend
          ignore: [node_modules/, .nuxt/, .output/, .data/, package.json, bun.lock, .env]
        - path: ./frontend/package.json
          action: rebuild
        - path: ./frontend/bun.lock
          action: rebuild

  celeryworker:
    image: ${IMAGE_PREFIX:-local}/backend-dev:${TAG:-dev}
    build:
      target: development
    restart: 'no'
    develop:
      watch:
        - path: ./backend/app
          action: sync+restart
          target: /app/app
          ignore: ['**/__pycache__/**']
        - path: ./backend/pyproject.toml
          action: rebuild
        - path: ./backend/uv.lock
          action: rebuild

  celerybeat:
    image: ${IMAGE_PREFIX:-local}/backend-dev:${TAG:-dev}
    build:
      target: development
    restart: 'no'
    develop:
      watch:
        - path: ./backend/app
          action: sync+restart
          target: /app/app
          ignore: ['**/__pycache__/**']
        - path: ./backend/pyproject.toml
          action: rebuild
        - path: ./backend/uv.lock
          action: rebuild

  queue:
    restart: 'no'
    ports: ['127.0.0.1:6379:6379']

  pgadmin:
    restart: 'no'
    ports: ['127.0.0.1:5050:5050']

  flower:
    restart: 'no'
    ports: ['127.0.0.1:5555:5555']

  mailcatcher:
    profiles: [tools]
    image: schickling/mailcatcher:0.7.1
    ports: ['127.0.0.1:1080:1080', '127.0.0.1:1025:1025']
